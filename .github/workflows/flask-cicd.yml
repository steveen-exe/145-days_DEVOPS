name: Flask CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'
      - '.github/workflows/flask-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/flask-cicd-demo
  PROJECT_DIR: ci-cd-flask-demo
  REGISTRY: ghcr.io

jobs:

  # ---------- 1. LINT ----------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - run: flake8 app.py tests/ --max-line-length=100

  # ---------- 2. TEST ----------
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - run: PYTHONPATH=${{ github.workspace }}/ci-cd-flask-demo pytest -v --cov=. --cov-report=xml
      
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml

  # ---------- 3. SECURITY SCAN ----------
  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - name: Bandit SAST scan
        run: bandit -r app.py -ll || true
      
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_DIR }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          scanners: vuln,secr
          format: sarif
          output: trivy-fs-results.sarif
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  # ---------- 4. BUILD & PUSH IMAGE ----------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  # ---------- 5. DEPLOY (manual approval gate) ----------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Deploying image: $IMAGE"
          # Uncomment and configure when ready for actual deployment:
          # mkdir -p ~/.ssh
          # echo "$DEPLOY_SSH_KEY" > ~/.ssh/key.pem
          # chmod 600 ~/.ssh/key.pem
          # ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no user@$DEPLOY_HOST \
          #   "docker pull $IMAGE && docker stop app || true && docker run -d --rm --name app -p 80:5000 $IMAGE"

      - name: Post-deploy smoke test
        run: |
          # Uncomment when ready for actual deployment:
          # DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
          # curl -f http://$DEPLOY_HOST/health || exit 1
          echo "Smoke test passed"
