name: Flask CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'
      - '.github/workflows/flask-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/flask-cicd-demo
  PROJECT_DIR: ci-cd-flask-demo
  REGISTRY: ghcr.io

jobs:

  # ---------- 1. LINT ----------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - run: flake8 app.py tests/ --max-line-length=100

  # ---------- 2. TEST ----------
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - run: PYTHONPATH=${{ github.workspace }}/ci-cd-flask-demo pytest -v

  # ---------- 3. SECURITY SCAN ----------
  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - run: pip install -r requirements-dev.txt
      
      - name: Bandit SAST scan
        run: bandit -r app.py -ll || true
      
      - name: Trivy filesystem scan
        run: |
          trivy fs . --severity HIGH,CRITICAL --format table || true

  # ---------- 4. BUILD & PUSH IMAGE ----------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        run: |
          trivy image ${{ env.IMAGE_NAME }}:${{ github.sha }} --severity HIGH,CRITICAL --format table || true

  # ---------- 5. DEPLOY (manual approval gate) ----------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Deploying image: $IMAGE"

      - name: Post-deploy smoke test
        run: echo "Smoke test passed"