name: Flask CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'
      - '.github/workflows/flask-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ci-cd-flask-demo/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/flask-cicd-demo
  PROJECT_DIR: ci-cd-flask-demo

jobs:

  # ---------- 1. LINT ----------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: flake8 app.py tests/ --max-line-length=100

  # ---------- 2. TEST ----------
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=${{ github.workspace }}/ci-cd-flask-demo pytest -v

  # ---------- 3. SECURITY SCAN ----------
  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ci-cd-flask-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Bandit SAST scan
        run: bandit -r app.py -ll
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_DIR }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ---------- 4. BUILD & PUSH IMAGE ----------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}

      - name: Scan built image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL

  # ---------- 5. DEPLOY (manual approval gate) ----------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Would deploy $IMAGE to $DEPLOY_HOST"
          # ssh -i key.pem user@$DEPLOY_HOST "docker pull $IMAGE && docker stop app || true && docker run -d --rm --name app -p 80:5000 $IMAGE"

      - name: Post-deploy smoke test
        run: echo "Would curl http://$DEPLOY_HOST/health"